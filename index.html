<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deckblatt Silberhochzeit</title>
<style>
body{margin:0;background:#eee;font-family:Arial,sans-serif;text-align:center}
main{max-width:720px;margin:auto;padding:15px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
label,button{background:#a20f25;color:#fff;border:0;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer}
input{display:none}
.stage{position:relative;width:100%;aspect-ratio:2/3;background:white;overflow:hidden;box-shadow:0 3px 18px #0003}
#photo{position:absolute;left:22.5%;top:36.4%;width:59%;height:34.5%;object-fit:cover;object-position:center;display:none}
#frame{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
</style></head>
<body><main>
<h2>Deckblatt – eigenes Foto einsetzen</h2>
<div class="controls"><label>Foto auswählen<input id="pick" type="file" accept="image/*"></label><button id="clear">Foto entfernen</button></div>
<div class="stage"><img id="photo"><img id="frame" src="deckblatt-leer-v2.png?v=2"></div>
<p>Beim Öffnen ist das Herz leer. Erst nach „Foto auswählen“ erscheint dein Foto.</p>
<script>
const pick=document.getElementById('pick'),photo=document.getElementById('photo');
pick.onchange=()=>{const f=pick.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo.src=r.result;photo.style.display='block'};r.readAsDataURL(f)};
document.getElementById('clear').onclick=()=>{photo.removeAttribute('src');photo.style.display='none';pick.value=''};
</script>
</main></body></html>

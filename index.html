<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Deckblatt – Silberhochzeit</title>
<style>
body{margin:0;background:#eee;font-family:Arial,sans-serif;text-align:center}
main{max-width:720px;margin:auto;padding:15px}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:12px 0}
label,button{background:#a20f25;color:white;border:0;border-radius:9px;padding:11px 16px;font-weight:bold;cursor:pointer}
input{display:none}
.stage{position:relative;width:100%;aspect-ratio:2/3;background:white;overflow:hidden;box-shadow:0 3px 18px #0003}
#photo{position:absolute;left:22.5%;top:36.4%;width:59%;height:34.5%;object-fit:cover;object-position:center;display:none}
#cover{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
p{font-size:14px;color:#555}
</style>
</head>
<body><main>
<h2>Silberhochzeit – Deckblatt</h2>
<div class="controls">
<label>Foto auswählen<input id="pick" type="file" accept="image/*"></label>
<button id="save">Fertiges Deckblatt speichern</button>
</div>
<div class="stage">
<img id="photo" alt="">
<img id="cover" src="deckblatt.png" alt="Deckblatt">
</div>
<p>Das ausgewählte Foto wird nicht retuschiert. Es wird nur proportional hinter das Herz gelegt.</p>
<script>
const pick=document.getElementById('pick'), photo=document.getElementById('photo');
pick.onchange=()=>{const f=pick.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{photo.src=r.result;photo.style.display='block'};r.readAsDataURL(f)};
document.getElementById('save').onclick=async()=>{
 if(!photo.src){alert('Bitte zuerst ein Foto auswählen.');return;}
 const c=document.createElement('canvas');c.width=1024;c.height=1536;
 const x=c.getContext('2d'), cover=new Image();cover.src='deckblatt.png';
 await Promise.all([photo.decode(),cover.decode()]);
 const b={x:230,y:560,w:596,h:525};
 const s=Math.max(b.w/photo.naturalWidth,b.h/photo.naturalHeight);
 const w=photo.naturalWidth*s,h=photo.naturalHeight*s;
 x.drawImage(photo,b.x+(b.w-w)/2,b.y+(b.h-h)/2,w,h);
 x.drawImage(cover,0,0);
 const a=document.createElement('a');a.download='Silberhochzeit-Deckblatt.png';a.href=c.toDataURL('image/png');a.click();
};
</script>
</main></body></html>
